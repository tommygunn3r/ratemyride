<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate My Ride — CARR-9000 Automotive Analysis</title>
  <meta name="description" content="Upload a photo of your car. CARR-9000 will judge it with clinical precision and zero mercy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --accent: #f5a623;
      --accent-dim: rgba(245, 166, 35, 0.15);
      --text: #ffffff;
      --text-dim: #888888;
      --border: rgba(255,255,255,0.08);
      --green: #4caf50;
      --yellow: #ff9800;
      --red: #f44336;
      --gold: #f5a623;
      --silver: #9e9e9e;
      --bronze: #cd7f32;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ─── LAYOUT ─────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    #header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 24px 20px;
      flex-shrink: 0;
    }

    #header img {
      height: 72px;
      width: auto;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 24px 40px;
      position: relative;
    }

    #footer {
      text-align: center;
      padding: 20px 24px;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    /* ─── UPLOAD ZONE ────────────────────────────────── */
    #upload-section {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      transition: opacity 0.4s ease;
    }

    #drop-zone {
      width: 100%;
      border: 2px dashed rgba(245, 166, 35, 0.4);
      border-radius: 12px;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: rgba(245, 166, 35, 0.03);
    }

    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    #drop-zone .drop-icon {
      font-size: 52px;
      line-height: 1;
      filter: grayscale(0.3);
    }

    #drop-zone .drop-title {
      font-family: 'Roboto Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    #drop-zone .drop-sub {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.5;
    }

    .upload-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .upload-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .upload-btn.primary:hover {
      background: #e0941a;
      border-color: #e0941a;
    }

    #file-input, #camera-input { display: none; }

    /* ─── SCANNING OVERLAY ───────────────────────────── */
    #scan-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 40px;
    }

    #scan-overlay.active { display: flex; }

    .scan-logo {
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.15em;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
    }

    .scan-logo span {
      color: var(--accent);
    }

    .scan-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 480px;
      padding: 0 24px;
    }

    .scan-line {
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(12px, 3vw, 14px);
      color: var(--green);
      letter-spacing: 0.08em;
      height: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.85;
    }

    .scan-line::before {
      content: '▶';
      font-size: 10px;
      color: var(--accent);
    }

    .scan-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(76, 175, 80, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .scan-bar {
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--green), var(--green), transparent);
      border-radius: 2px;
      animation: scanSlide 1.4s ease-in-out infinite;
      width: 40%;
    }

    @keyframes scanSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .scan-status {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: rgba(76, 175, 80, 0.5);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ─── ACTION BUTTONS (results mode) ─────────────── */
    #action-bar {
      display: none;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
      max-width: 900px;
    }

    #action-bar.active { display: flex; }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    #btn-download {
      background: var(--accent);
      color: #000;
    }
    #btn-download:hover { background: #e0941a; }

    #btn-share {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
    }
    #btn-share:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); }

    #btn-reset {
      background: rgba(255,255,255,0.05);
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #btn-reset:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

    /* ─── IFRAME WRAPPER ─────────────────────────────── */
    #result-frame-wrap {
      display: none;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    #result-frame-wrap.active { display: block; }

    #result-frame {
      width: 900px;
      transform-origin: top left;
      border: none;
      display: block;
      border-radius: 4px;
      overflow: hidden;
    }

    /* ─── ERROR TOAST ────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a1a;
      border: 1px solid rgba(244, 67, 54, 0.4);
      color: var(--text);
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 14px 24px;
      border-radius: 8px;
      max-width: 480px;
      width: calc(100% - 48px);
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 2000;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── ROAST MODE ─────────────────────────────────── */
    body.roast-mode {
      --accent: #e53935;
      --accent-dim: rgba(229, 57, 53, 0.15);
    }

    body.roast-mode #drop-zone {
      border-color: rgba(229, 57, 53, 0.4);
      background: rgba(229, 57, 53, 0.03);
    }

    body.roast-mode #drop-zone:hover,
    body.roast-mode #drop-zone.drag-over {
      border-color: #e53935;
      background: rgba(229, 57, 53, 0.1);
    }

    body.roast-mode .upload-btn.primary {
      background: #e53935;
      border-color: #e53935;
    }

    body.roast-mode .upload-btn.primary:hover {
      background: #c62828;
      border-color: #c62828;
    }

    body.roast-mode #btn-download {
      background: #e53935;
    }

    body.roast-mode #btn-download:hover { background: #c62828; }

    /* ─── ROAST TOGGLE ───────────────────────────────── */
    #roast-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    #roast-toggle-wrap:hover { color: var(--text); }

    .toggle-track {
      width: 52px;
      height: 28px;
      border-radius: 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      position: relative;
      transition: background 0.25s, border-color 0.25s;
      flex-shrink: 0;
      cursor: pointer;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: transform 0.25s, background 0.25s;
    }

    #roast-checkbox { display: none; }

    #roast-checkbox:checked ~ #roast-toggle-wrap .toggle-track {
      background: #e53935;
      border-color: #e53935;
    }

    #roast-checkbox:checked ~ #roast-toggle-wrap .toggle-thumb {
      transform: translateX(24px);
      background: #fff;
    }

    #roast-checkbox:checked ~ #roast-toggle-wrap #toggle-label-text {
      color: #e53935;
    }

    /* ─── MOBILE ─────────────────────────────────────── */
    @media (max-width: 480px) {
      #header { padding: 20px 16px 14px; }
      #header img { height: 56px; }
      #main { padding: 12px 16px 32px; }
      #drop-zone { padding: 44px 24px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header id="header">
    <img src="assets/logo.png" alt="Rate My Ride" />
  </header>

  <main id="main">
    <!-- Upload state -->
    <div id="upload-section">
      <div id="drop-zone">
        <div class="drop-title" id="drop-title">DROP YOUR CAR HERE</div>
        <div class="drop-sub" id="drop-sub">CARR-9000 will render its verdict.<br />JPEG · PNG · WEBP · HEIC · Max 10MB</div>
      </div>
      <div class="upload-buttons">
        <button class="upload-btn primary" onclick="document.getElementById('file-input').click()">
          📁 Browse Files
        </button>
        <button class="upload-btn" onclick="document.getElementById('camera-input').click()">
          📷 Camera
        </button>
      </div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" />
      <input type="file" id="camera-input" accept="image/*" capture="environment" />

      <input type="checkbox" id="roast-checkbox" />
      <div id="roast-toggle-wrap">
        <label for="roast-checkbox" style="display:flex;align-items:center;gap:12px;cursor:pointer">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          <span id="toggle-label-text">ROAST MODE</span>
        </label>
      </div>
    </div>

    <!-- Action buttons (results mode) -->
    <div id="action-bar">
      <button class="action-btn" id="btn-download">📥 Download as Image</button>
      <button class="action-btn" id="btn-share">🔗 Share</button>
      <button class="action-btn" id="btn-reset">🔄 Rate Another</button>
    </div>

    <!-- Results iframe -->
    <div id="result-frame-wrap">
      <iframe id="result-frame" scrolling="no" title="CARR-9000 Assessment"></iframe>
    </div>
  </main>

  <footer id="footer">
    Your image is never stored. CARR-9000 judges your car and forgets it immediately.
  </footer>
</div>

<!-- Scanning overlay -->
<div id="scan-overlay">
  <div class="scan-logo">CARR<span>-9000</span></div>
  <div class="scan-content">
    <div class="scan-line" id="scan-line-text">Initializing analysis systems...</div>
    <div class="scan-bar-wrap">
      <div class="scan-bar"></div>
    </div>
    <div class="scan-status">PROCESSING — DO NOT POWER DOWN</div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────
const API_URL = 'https://ratemyride-pi.vercel.app/api/rate';
const MAX_SIZE_MB = 10;

// ─── STATE ───────────────────────────────────────────────────
let currentData = null;
let currentImageB64 = null;
let currentImageMime = null;
let currentCarName = 'the-vehicle';
let isRoastMode = false;

// ─── SCAN MESSAGES ───────────────────────────────────────────
const scanMessages = [
  'Initializing analysis systems...',
  'Calibrating shame index...',
  'Analyzing paint & exterior...',
  'Assessing wheel fitment...',
  'Evaluating stance & suspension...',
  'Inspecting cleanliness metrics...',
  'Profiling vehicle identity...',
  'Fabricating engine estimate...',
  'Cataloguing modifications...',
  'Measuring overall vibe...',
  'Assessing owner psychological profile...',
  'Cross-referencing bad decisions database...',
  'Calculating disappointment coefficient...',
  'Compiling verdict...',
];

const roastScanMessages = [
  'Disabling diplomatic filters...',
  'Cataloguing your poor decisions...',
  'Documenting the evidence...',
  'Preparing the roast...',
  'Locating any remaining dignity...',
  'Assessing the damage...',
  'Consulting the hall of shame...',
  'Measuring disappointment levels...',
  'Verifying owner poor judgment...',
  'Calculating cringe coefficient...',
  'Cross-referencing regrettable choices...',
  'Fabricating excuses on your behalf...',
  'Drafting condolences...',
  'Rendering final verdict...',
];

let scanInterval = null;
let scanIdx = 0;

function startScan() {
  const messages = isRoastMode ? roastScanMessages : scanMessages;
  scanIdx = 0;
  const el = document.getElementById('scan-line-text');
  el.textContent = messages[0];
  scanInterval = setInterval(() => {
    scanIdx = (scanIdx + 1) % messages.length;
    el.textContent = messages[scanIdx];
  }, 1100);
  document.getElementById('scan-overlay').classList.add('active');
}

// ─── ROAST TOGGLE ─────────────────────────────────────────────
document.getElementById('roast-checkbox').addEventListener('change', function() {
  isRoastMode = this.checked;
  document.body.classList.toggle('roast-mode', isRoastMode);

  const logoEl = document.querySelector('#header img');
  logoEl.src = isRoastMode ? 'assets/logo-roast.png' : 'assets/logo.png';

  document.getElementById('drop-title').textContent = isRoastMode
    ? 'FEED IT TO CARR-9000'
    : 'DROP YOUR CAR HERE';

  document.getElementById('drop-sub').innerHTML = isRoastMode
    ? 'CARR-9000 will render it irrelevant.<br />JPEG · PNG · WEBP · HEIC · Max 10MB'
    : 'CARR-9000 will render its verdict.<br />JPEG · PNG · WEBP · HEIC · Max 10MB';
});

function stopScan() {
  clearInterval(scanInterval);
  document.getElementById('scan-overlay').classList.remove('active');
}

// ─── TOAST ───────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, duration = 4000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ─── DRAG & DROP ─────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');

dropZone.addEventListener('click', () => document.getElementById('file-input').click());

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

document.getElementById('camera-input').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

// ─── FILE HANDLING ───────────────────────────────────────────
function handleFile(file) {
  const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];
  if (!allowed.includes(file.type) && !file.name.match(/\.(heic|heif)$/i)) {
    showToast('CARR-9000 only accepts JPEG, PNG, WEBP, or HEIC images.');
    return;
  }
  if (file.size > MAX_SIZE_MB * 1024 * 1024) {
    showToast(`File exceeds ${MAX_SIZE_MB}MB. CARR-9000 has standards.`);
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    compressImage(e.target.result, compressed => {
      const base64 = compressed.split(',')[1];
      submitImage(base64, 'image/jpeg', compressed);
    });
  };
  reader.readAsDataURL(file);
}

// ─── IMAGE COMPRESSION ───────────────────────────────────────
function compressImage(dataUrl, callback) {
  const img = new Image();
  img.onload = () => {
    const MAX_DIM = 1600;
    let { width, height } = img;
    if (width > MAX_DIM || height > MAX_DIM) {
      if (width > height) { height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
      else { width = Math.round(width * MAX_DIM / height); height = MAX_DIM; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.82));
  };
  img.src = dataUrl;
}

// ─── SUBMIT ──────────────────────────────────────────────────
async function submitImage(base64, mimeType, dataUrl) {
  currentImageB64 = base64;
  currentImageMime = mimeType;

  const minDuration = 4500;
  const startTime = Date.now();

  startScan();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64, mimeType, roastMode: isRoastMode })
    });

    let data;
    const rawText = await res.text();
    try {
      data = JSON.parse(rawText);
    } catch {
      data = { error: res.status === 413 ? 'Image too large for CARR-9000\'s servers. Try a smaller file.' : `Server error ${res.status}.` };
    }

    // Ensure minimum scan duration
    const elapsed = Date.now() - startTime;
    if (elapsed < minDuration) {
      await new Promise(r => setTimeout(r, minDuration - elapsed));
    }

    stopScan();

    if (!res.ok) {
      showToast(data.error || 'CARR-9000 encountered a transmission error.');
      return;
    }

    if (data.valid === false) {
      showToast(data.message || 'CARR-9000 has rejected this submission.');
      return;
    }

    currentData = data;
    currentCarName = (data.car_name || 'the-vehicle').toLowerCase().replace(/[^a-z0-9]+/g, '-');
    renderResult(data, dataUrl);

  } catch (err) {
    stopScan();
    console.error(err);
    showToast('CARR-9000 lost signal. Check your connection and try again.');
  }
}

// ─── SCORE HELPERS ───────────────────────────────────────────
function categoryColor(score) {
  if (score <= 300) return '#4caf50';
  if (score <= 700) return '#ff9800';
  return '#f44336';
}

function totalBadge(total) {
  if (total <= 2500) return { color: '#f5a623', label: 'Exceptional Specimen' };
  if (total <= 5000) return { color: '#9e9e9e', label: 'Adequate' };
  if (total <= 7500) return { color: '#cd7f32', label: 'Concerning' };
  return { color: '#f44336', label: 'A Cry For Help' };
}

function pct(score, max) {
  return Math.min(100, Math.round((score / max) * 100));
}

// ─── GRADE HELPER (Layout D) ──────────────────────────────────
function getGrade(score) {
  if (score <= 250) return 'A+';
  if (score <= 500) return 'B';
  if (score <= 750) return 'C';
  if (score <= 1000) return 'D';
  return 'F';
}
function gradeColor(score) {
  if (score <= 250) return '#2e7d32';
  if (score <= 500) return '#558b2f';
  if (score <= 750) return '#f57f17';
  if (score <= 1000) return '#e65100';
  return '#b71c1c';
}

// ─── SHARED IFRAME FONTS ──────────────────────────────────────
const FONTS_STANDARD = `<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>`;
const FONTS_WITH_CAVEAT = `<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet"/>`;

// ─── LAYOUT A — Classic Editorial ────────────────────────────
function layoutA(data, imageDataUrl, ctx) {
  const { badge, badgeColor, logoSrc, issueNum, accentColor, masthead } = ctx;
  const storyParas = (data.story||'').split(/\n\n+/).filter(p=>p.trim()).map(p=>`<p>${p.trim()}</p>`);

    <div style="margin-top:14px;height:190px;overflow:hidden;border:1px solid #b5a98a"><img src="${imageDataUrl}" style="width:100%;height:100%;object-fit:cover"/></div>
  </div>
</div>
<div style="background:#2c2c2c;padding:12px 28px;display:flex;justify-content:space-between;align-items:center"><div style="font:400 9px/1.5 'Courier New',monospace;color:rgba(255,255,255,.4);letter-spacing:.04em">RESULTS GENERATED BY CARR-9000. FOR ENTERTAINMENT PURPOSES ONLY. ACCURACY NOT GUARANTEED. FEELINGS NOT CONSIDERED.</div><div style="font:700 9px/1 'Courier New',monospace;color:rgba(255,255,255,.25);letter-spacing:.1em">CARR-9000</div></div>
</body></html>`;
}

// ─── RENDER MAGAZINE ─────────────────────────────────────────
function renderResult(data, imageDataUrl) {
  const badge = totalBadge(data.total_score);
  const badgeColor = isRoastMode ? '#e53935' : badge.color;
  const accentColor = isRoastMode ? '#e53935' : '#f5a623';
  const logoSrc = document.querySelector('#header img').src;
  const issueNum = Math.floor(Math.random() * 900) + 100;

  const masthead = isRoastMode ? 'CARR-9000 ROAST QUARTERLY' : 'CARR-9000 AUTOMOTIVE QUARTERLY';
  const ctx = { badge, badgeColor, accentColor, logoSrc, issueNum, masthead };

  const layouts = [layoutA, layoutB, layoutC, layoutD, layoutE];
  const html = layouts[Math.floor(Math.random() * layouts.length)](data, imageDataUrl, ctx);

  const blob = new Blob([html], { type: 'text/html' });
  const blobUrl = URL.createObjectURL(blob);

  const frame = document.getElementById('result-frame');
  frame.style.height = '1500px';
  frame.onload = () => {
    const measure = () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const h = doc.body.scrollHeight;
        if (h > 200) {
          frame.style.height = h + 'px';
          scaleFrame();
        }
      } catch { /* keep fallback height */ }
    };
    setTimeout(measure, 500);   // after wrap is visible
    setTimeout(measure, 1500);  // after Google Fonts load
  };
  frame.src = blobUrl;

  // Configure share button based on device capabilities
  const shareBtn = document.getElementById('btn-share');
  const testFile = new File([''], 'test.jpg', { type: 'image/jpeg' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [testFile] })) {
    shareBtn.textContent = '📤 Share Image';
    shareBtn.style.display = '';
  } else if (navigator.share) {
    shareBtn.textContent = '📤 Share';
    shareBtn.style.display = '';
  } else if (navigator.clipboard) {
    shareBtn.textContent = '📋 Copy Text';
    shareBtn.style.display = '';
  } else {
    shareBtn.style.display = 'none';
  }

  // Show results UI
  document.getElementById('upload-section').style.opacity = '0';
  document.getElementById('upload-section').style.pointerEvents = 'none';
  setTimeout(() => {
    document.getElementById('upload-section').style.display = 'none';
    document.getElementById('action-bar').classList.add('active');
    document.getElementById('result-frame-wrap').classList.add('active');
    scaleFrame();
  }, 400);
}

// ─── SCALE FRAME ─────────────────────────────────────────────
function scaleFrame() {
  const frame = document.getElementById('result-frame');
  const wrap = document.getElementById('result-frame-wrap');
  if (!wrap.clientWidth) return;
  const scale = Math.min(1, wrap.clientWidth / 900);
  frame.style.transform = scale < 1 ? `scale(${scale})` : '';
  const naturalHeight = parseInt(frame.style.height) || 1500;
  wrap.style.height = Math.ceil(naturalHeight * scale) + 'px';
}

window.addEventListener('resize', scaleFrame);

// ─── CAPTURE FRAME (export quality fix) ──────────────────────
async function captureFrame() {
  const frame = document.getElementById('result-frame');
  const wrap = document.getElementById('result-frame-wrap');
  const savedTransform = frame.style.transform;
  const savedOverflow = wrap.style.overflow;
  frame.style.transform = '';
  wrap.style.overflow = 'visible';
  await new Promise(r => setTimeout(r, 50));
  const frameDoc = frame.contentDocument || frame.contentWindow.document;
  const canvas = await html2canvas(frameDoc.body, {
    scale: 2,
    useCORS: true,
    allowTaint: false,
    logging: false,
    backgroundColor: null,
    width: 900,
    windowWidth: 900,
    scrollX: 0,
    scrollY: 0
  });
  frame.style.transform = savedTransform;
  wrap.style.overflow = savedOverflow;
  return canvas;
}

// ─── DOWNLOAD ────────────────────────────────────────────────
document.getElementById('btn-download').addEventListener('click', async () => {
  const btn = document.getElementById('btn-download');
  btn.textContent = '⏳ Capturing...';
  btn.disabled = true;

  try {
    const canvas = await captureFrame();
    const link = document.createElement('a');
    link.download = `ratemyride-${currentCarName}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  } catch (err) {
    console.error(err);
    showToast('Capture failed. CARR-9000 is embarrassed.');
  }

  btn.textContent = '📥 Download as Image';
  btn.disabled = false;
});

// ─── SHARE ───────────────────────────────────────────────────
document.getElementById('btn-share').addEventListener('click', async () => {
  if (!currentData) return;
  const badge = totalBadge(currentData.total_score);
  const shareText = `CARR-9000 has issued its verdict on ${currentData.car_name}.\nFinal Score: ${currentData.total_score} / 10,000 — "${badge.label}"`;

  if (navigator.share) {
    try {
      const canvas = await captureFrame();
      canvas.toBlob(async blob => {
        const file = new File([blob], `ratemyride-${currentCarName}.jpg`, { type: 'image/jpeg' });
        try {
          await navigator.share({ title: 'Rate My Ride', text: shareText, files: [file] });
        } catch {
          await navigator.share({ title: 'Rate My Ride', text: shareText });
        }
      }, 'image/jpeg', 0.92);
    } catch (err) {
      console.error(err);
    }
  } else {
    try {
      await navigator.clipboard.writeText(shareText);
      const btn = document.getElementById('btn-share');
      btn.textContent = '✅ Copied!';
      setTimeout(() => { btn.textContent = '🔗 Share'; }, 2500);
    } catch {
      showToast('Could not copy to clipboard.');
    }
  }
});

// ─── RESET ───────────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  currentData = null;
  currentImageB64 = null;
  currentImageMime = null;
  currentCarName = 'the-vehicle';

  // Revoke old blob
  const frame = document.getElementById('result-frame');
  if (frame.src && frame.src.startsWith('blob:')) URL.revokeObjectURL(frame.src);
  frame.src = 'about:blank';
  frame.style.height = '';
  frame.style.transform = '';
  document.getElementById('result-frame-wrap').style.height = '';

  document.getElementById('action-bar').classList.remove('active');
  document.getElementById('result-frame-wrap').classList.remove('active');

  const uploadSec = document.getElementById('upload-section');
  uploadSec.style.display = 'flex';
  uploadSec.style.pointerEvents = 'auto';
  setTimeout(() => { uploadSec.style.opacity = '1'; }, 20);

  // Reset file inputs
  document.getElementById('file-input').value = '';
  document.getElementById('camera-input').value = '';

  // Reset roast mode
  document.getElementById('roast-checkbox').checked = false;
  isRoastMode = false;
  document.body.classList.remove('roast-mode');
  document.querySelector('#header img').src = 'assets/logo.png';
  document.getElementById('drop-title').textContent = 'DROP YOUR CAR HERE';
  document.getElementById('drop-sub').innerHTML = 'CARR-9000 will render its verdict.<br />JPEG · PNG · WEBP · HEIC · Max 10MB';
});
</script>
